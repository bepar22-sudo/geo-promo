<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="드론 날리면서 지도 만드는 과가 있다?! 대구과학대학교 측지정보과 홍보 쇼츠">
<meta property="og:type" content="video.other">
<meta property="og:title" content="대구과학대학교 측지정보과 | 드론 날리면서 지도 만드는 과">
<meta property="og:description" content="끝까지 보면 진로 결정! 측량·지적·공간정보·드론을 배우는 측지정보과 홍보 영상">
<meta property="og:image" content="https://bepar22-sudo.github.io/geo-promo/thumb.jpg">
<meta property="og:url" content="https://bepar22-sudo.github.io/geo-promo/">
<meta property="og:video" content="https://bepar22-sudo.github.io/geo-promo/geo_promo_shorts.mp4">
<meta name="theme-color" content="#0b2c5f">
<style>
:root{--hy1:#0b2c5f;--hy2:#1f4e9e;--hy3:#5b8ad6;--hy4:#dce7f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b2c5f}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;
  font-family:"Paperlogy","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;
  background:radial-gradient(ellipse at 50% 0%,#1f4e9e 0%,#0b2c5f 60%) fixed}
.org{font-size:14px;opacity:.85;letter-spacing:.04em}
h1{font-size:22px;font-weight:800;margin:4px 0 16px;text-align:center}
.player{width:100%;max-width:400px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 12px 32px rgba(0,0,0,.35)}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
a.btn{color:#0b2c5f;background:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px}
a.btn.line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.foot{margin-top:18px;font-size:12px;opacity:.7;text-align:center}
</style>
</head>
<body>
  <div class="org">대구과학대학교</div>
  <h1>측지정보과 홍보 영상</h1>
  <div class="player">
    <video src="geo_promo_shorts.mp4" poster="thumb.jpg" controls playsinline preload="metadata"></video>
  </div>
  <div class="btns">
    <a class="btn" href="https://geo.tsu.ac.kr/">학과 홈페이지</a>
    <a class="btn line" href="https://www.tsu.ac.kr/">대학 홈페이지</a>
  </div>
  <p class="foot">재생 버튼을 누르면 소리와 함께 재생됩니다.</p>
</body>
